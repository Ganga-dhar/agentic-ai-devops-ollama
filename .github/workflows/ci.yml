name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:           # allow manual runs from the Actions tab

permissions:
  contents: read               # read repo — kept minimal for security

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Lint with flake8
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        # E501 – line too long (raised by the banner string in agent.py)
        # W503 – line break before binary operator (style choice)
        run: |
          flake8 src/ tests/ \
            --max-line-length=100 \
            --extend-ignore=E501,W503 \
            --statistics

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Unit tests (no external services required)
  # ─────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            -m "not integration" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --html=reports/unit-tests.html \
            --self-contained-html \
            -v

      - name: Upload unit test HTML report
        uses: actions/upload-artifact@v4
        if: always()           # upload even when tests fail
        with:
          name: unit-test-report
          path: reports/unit-tests.html
          retention-days: 30

      - name: Upload coverage XML (for coverage badge tools)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Integration tests (real Docker daemon on ubuntu-latest)
  # ─────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify Docker daemon is running
        run: docker info

      - name: Run integration tests
        run: |
          pytest tests/ \
            -m "integration" \
            --html=reports/integration-tests.html \
            --self-contained-html \
            -v

      - name: Upload integration test HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-report
          path: reports/integration-tests.html
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Merge reports and prepare GitHub Pages artifact
  # Runs after both test jobs, always — so the report is published even
  # when some tests fail.
  # ─────────────────────────────────────────────────────────────────────────
  build-report:
    name: Build Pages Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download unit test report
        uses: actions/download-artifact@v4
        with:
          name: unit-test-report
          path: site/
        continue-on-error: true    # don't fail if unit-tests job was skipped

      - name: Download integration test report
        uses: actions/download-artifact@v4
        with:
          name: integration-test-report
          path: site/
        continue-on-error: true

      - name: Generate index page
        run: |
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Agentic AI DevOps — Test Reports</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                     max-width: 800px; margin: 60px auto; padding: 0 20px; color: #24292f; }
              h1   { border-bottom: 1px solid #d0d7de; padding-bottom: 12px; }
              .card { border: 1px solid #d0d7de; border-radius: 6px; padding: 20px;
                      margin: 16px 0; display: flex; justify-content: space-between;
                      align-items: center; }
              .card h2 { margin: 0 0 6px; font-size: 1.1rem; }
              .card p  { margin: 0; color: #656d76; font-size: 0.9rem; }
              a.btn { background: #0969da; color: #fff; padding: 8px 16px;
                      border-radius: 6px; text-decoration: none; font-size: 0.9rem; }
              a.btn:hover { background: #0860ca; }
              footer { margin-top: 40px; color: #656d76; font-size: 0.85rem; }
            </style>
          </head>
          <body>
            <h1>🤖 Agentic AI DevOps — Test Reports</h1>
            <p>Latest test results from the CI pipeline.</p>

            <div class="card">
              <div>
                <h2>Unit Tests</h2>
                <p>Tool wrappers, argument parsing, error paths, config defaults</p>
              </div>
              <a class="btn" href="unit-tests.html">View Report</a>
            </div>

            <div class="card">
              <div>
                <h2>Integration Tests</h2>
                <p>Real Docker daemon — docker ps, images, network ls, volume ls</p>
              </div>
              <a class="btn" href="integration-tests.html">View Report</a>
            </div>

            <footer>
              Generated by GitHub Actions &bull;
              <a href="https://github.com/${{ github.repository }}">Repository</a>
            </footer>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
