name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

# Pages deploy needs write access; all other jobs only need read.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Lint
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length=100 \
            --extend-ignore=E501,W503 \
            --statistics

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Unit tests
  # ─────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            -m "not integration" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --html=reports/unit-tests.html \
            --self-contained-html \
            -v

      - name: Upload unit test HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: reports/unit-tests.html
          retention-days: 30

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Integration tests (real Docker daemon)
  # ─────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify Docker daemon is running
        run: docker info

      - name: Run integration tests
        run: |
          pytest tests/ \
            -m "integration" \
            --html=reports/integration-tests.html \
            --self-contained-html \
            -v

      - name: Upload integration test HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-report
          path: reports/integration-tests.html
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Agent validation — full ReAct loop (LLM + real tools)
  #
  # Uses qwen2.5:3b — the smallest model that reliably follows the ReAct
  # text format (Thought / Action / Action Input) needed for tool-use.
  # tinyllama (1.1B) cannot follow this format and always times out.
  # ─────────────────────────────────────────────────────────────────────────
  agent-validation:
    name: Agent Validation (Ollama)
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    timeout-minutes: 20

    env:
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_BASE_URL: http://localhost:11434
      AGENT_VERBOSE: "false"
      MAX_ITERATIONS: "6"
      QUESTION_TIMEOUT_SECS: "120"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # ── Install Ollama ───────────────────────────────────────────────────
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      # ── Start Ollama server in the background ────────────────────────────
      - name: Start Ollama server
        run: |
          ollama serve &
          # Wait until the REST API responds (up to 30 s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/ > /dev/null 2>&1; then
              echo "Ollama is ready after ${i}s"
              break
            fi
            sleep 1
          done

      # ── Pull the model ───────────────────────────────────────────────────
      - name: Pull model (${{ env.OLLAMA_MODEL }})
        run: |
          ollama pull ${{ env.OLLAMA_MODEL }}
          echo "Model pulled successfully"

      # ── Smoke-test: verify the model responds ────────────────────────────
      - name: Smoke-test model
        run: |
          ollama run ${{ env.OLLAMA_MODEL }} "Reply with only the word READY" \
            --nowordwrap 2>&1 | head -5

      # ── Run the agent against all questions ──────────────────────────────
      - name: Run agent validation questions
        run: |
          python scripts/run_agent_ci.py \
            --questions scripts/questions.txt \
            --output    reports/agent-results.json

      # ── Build the interactive HTML report ───────────────────────────────
      - name: Build agent HTML report
        if: always()
        run: |
          python scripts/build_agent_report.py \
            --input  reports/agent-results.json \
            --output reports/agent-validation.html

      - name: Upload agent validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-validation-report
          path: reports/agent-validation.html
          retention-days: 30

      - name: Upload agent results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-results-json
          path: reports/agent-results.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Build Pages site — merge all three HTML reports + index
  # ─────────────────────────────────────────────────────────────────────────
  build-report:
    name: Build Pages Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, agent-validation]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download unit test report
        uses: actions/download-artifact@v4
        with:
          name: unit-test-report
          path: site/
        continue-on-error: true

      - name: Download integration test report
        uses: actions/download-artifact@v4
        with:
          name: integration-test-report
          path: site/
        continue-on-error: true

      - name: Download agent validation report
        uses: actions/download-artifact@v4
        with:
          name: agent-validation-report
          path: site/
        continue-on-error: true

      - name: Generate index page
        run: |
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Agentic AI DevOps — CI Reports</title>
            <style>
              *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                     background: #f6f8fa; color: #24292f;
                     max-width: 860px; margin: 60px auto; padding: 0 20px; }
              h1   { font-size: 1.6rem; margin-bottom: 6px; }
              .sub { color: #656d76; font-size: 0.9rem; margin-bottom: 32px; }
              h2   { font-size: 1rem; font-weight: 600; color: #656d76;
                     text-transform: uppercase; letter-spacing: .05em;
                     margin: 28px 0 12px; }
              .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                      gap: 16px; }
              .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px;
                      padding: 20px; display: flex; flex-direction: column; gap: 8px; }
              .card .icon { font-size: 1.8rem; }
              .card h3 { font-size: 1rem; }
              .card p  { color: #656d76; font-size: 0.85rem; flex: 1; }
              a.btn { display: inline-block; margin-top: 8px; background: #0969da;
                      color: #fff; padding: 7px 16px; border-radius: 6px;
                      text-decoration: none; font-size: 0.85rem; }
              a.btn:hover { background: #0860ca; }
              footer { margin-top: 48px; color: #656d76; font-size: 0.8rem;
                       text-align: center; }
            </style>
          </head>
          <body>
            <h1>🤖 Agentic AI DevOps — CI Reports</h1>
            <p class="sub">Latest results from the GitHub Actions pipeline</p>

            <h2>Test Reports</h2>
            <div class="grid">
              <div class="card">
                <span class="icon">🧪</span>
                <h3>Unit Tests</h3>
                <p>Tool wrappers, argument parsing, error paths, config defaults — no external services needed</p>
                <a class="btn" href="unit-tests.html">View Report</a>
              </div>
              <div class="card">
                <span class="icon">🐳</span>
                <h3>Integration Tests</h3>
                <p>Real Docker daemon on the CI runner — docker ps, images, network ls, volume ls</p>
                <a class="btn" href="integration-tests.html">View Report</a>
              </div>
            </div>

            <h2>Agent Validation</h2>
            <div class="grid">
              <div class="card">
                <span class="icon">🤖</span>
                <h3>Agent Q&amp;A Report</h3>
                <p>Live agent running on Ollama inside CI — 12 questions across Docker, Kubernetes, and reasoning categories. Filter by status or category.</p>
                <a class="btn" href="agent-validation.html">View Report</a>
              </div>
            </div>

            <footer>
              Generated by GitHub Actions &bull;
              <a href="https://github.com/${{ github.repository }}">Repository</a>
            </footer>
          </body>
          </html>
          EOF

      # upload-pages-artifact creates the special "github-pages" artifact.
      # deploy-pages (job 6) MUST be in the same workflow run to find it.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ─────────────────────────────────────────────────────────────────────────
  # Job 6: Deploy to GitHub Pages
  # Same workflow run as build-report so deploy-pages can locate the
  # "github-pages" artifact. Skipped on pull requests.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-report
    if: |
      always() &&
      needs.build-report.result != 'skipped' &&
      github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
